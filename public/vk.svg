<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="vkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#124B7E" />
      <stop offset="100%" stop-color="#401A23" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  {/* Outer Glow Ring */}
  <circle cx="60" cy="60" r="56" fill="url(#vkGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)" />
  <circle cx="60" cy="60" r="50" fill="#401A23" opacity="0.4" />

  {/* Stylized Cricket Silhouette */}
  <path d="M45,85 L50,60 L60,40 L70,30 L80,25 L75,35 L68,48 L58,72 Z" fill="url(#goldGrad)" opacity="0.8" />
  
  {/* Jersey Number */}
  <text x="60" y="58" fill="url(#goldGrad)" font-family="'Outfit', 'Impact', sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="-1">18</text>
  
  {/* Player Initials / Name */}
  <text x="60" y="80" fill="#ffffff" font-family="'Google Sans', 'Arial', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">KOHLI</text>
  
  {/* Decorative Stars */}
  <polygon points="60,18 62,22 66,22 63,25 64,29 60,27 56,29 57,25 54,22 58,22" fill="url(#goldGrad)" />
  <polygon points="38,90 39,92 41,92 40,94 40,96 38,95 36,96 37,94 35,92 37,92" fill="url(#goldGrad)" opacity="0.6" />
  <polygon points="82,90 83,92 85,92 84,94 84,96 82,95 80,96 81,94 79,92 81,92" fill="url(#goldGrad)" opacity="0.6" />
</svg>
